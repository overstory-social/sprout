name: release

# Changesets: a PR to main with a changeset opens (or updates) a "Version
# packages" PR; merging that publishes both packages (a `fixed` group, one
# version). Publishing is npm TRUSTED PUBLISHING (OIDC): each package's
# Access page on npmjs.com names this repository and this workflow file as
# its publisher, so there is no token here — `id-token: write` is what npm
# checks, and it attaches provenance. Needs npm ≥ 11.5 (Node 22+ ships it)
# and, for the version PR, the repository's Actions setting "Allow GitHub
# Actions to create and approve pull requests".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gate
      - uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # provenance is npm's config, not changesets' flag
          NPM_CONFIG_PROVENANCE: 'true'
